backend:
  name: github
  # Le CMS enregistre les changements dans le dépôt qui alimente le site.
  repo: Sarthe72/une-escale-gourmande
  branch: master
  # Service d'authentification GitHub, hébergé sur le domaine officiel.
  base_url: https://uneescalegourmande.fr
  auth_endpoint: auth

site_url: https://uneescalegourmande.fr
display_url: https://uneescalegourmande.fr
logo_url: /images/logo-blanc.svg

locale: fr
media_folder: public/images
public_folder: /images

commit_messages:
  update: "Mise à jour depuis l'espace Benjamin : {{path}}"
  uploadMedia: "Ajout d'une photo depuis l'espace Benjamin : {{path}}"

collections:
  - name: chambre
    label: "Chambre d'hôtes"
    description: "Modifier les tarifs, les photos de la chambre et celles du domaine. Pensez à enregistrer à la fin."
    files:
      - label: "Tarifs"
        name: tarifs
        file: src/data/tarifs-chambre.json
        fields:
          - label: "Prix de base — 2 personnes + petit-déjeuner (€)"
            name: prix_base
            widget: number
            hint: "Prix hors saison pour 2 personnes, petit-déjeuner inclus."
          - label: "Prix haute saison — juillet et août (€)"
            name: prix_haute_saison
            widget: number
            hint: "Prix appliqué en juillet et août."
          - label: "Dîner en option — par personne (€)"
            name: prix_diner
            widget: number
            hint: "Prix du dîner à la table d'hôtes, par personne."
      - label: "Photos de la chambre"
        name: photos_chambre
        file: src/data/photos-chambre.json
        fields:
          - label: Photos
            name: photos
            widget: list
            fields:
              - label: Photo
                name: src
                widget: image
                hint: "Choisissez une photo nette. Nom conseillé : chambre-hotes-eyzerac-vue-terrasse.jpg (sans espace ni accent)."
              - label: "Legende de la photo (texte alternatif)"
                name: alt
                widget: string
                hint: "Décrivez simplement la photo : ex. « Suite avec terrasse privée à Eyzerac, Périgord Vert »."
      - label: "Photos du domaine"
        name: photos_domaine
        file: src/data/photos-domaine.json
        fields:
          - label: Photos
            name: photos
            widget: list
            fields:
              - label: Photo
                name: src
                widget: image
                hint: "Choisissez une photo nette. Nom conseillé : domaine-escale-gourmande-eyzerac-jardin.jpg (sans espace ni accent)."
              - label: "Legende de la photo (texte alternatif)"
                name: alt
                widget: string
                hint: "Décrivez simplement la photo et son lieu."

  - name: truffe
    label: "Menu Truffe"
    description: "Mettre à jour la composition et les photos du menu truffe."
    files:
      - label: "Composition du menu (les 5 temps)"
        name: menu_plats
        file: src/data/menu-truffe-plats.json
        fields:
          - label: "Les temps du menu"
            name: plats
            widget: list
            hint: "Chaque ligne correspond à un temps du menu. Gardez des descriptions courtes et gourmandes."
            fields:
              - { label: "Intitulé (ex. Entrée, Plat principal…)", name: label, widget: string }
              - { label: "Description courte", name: desc, widget: text }
      - label: "Photos du menu truffe"
        name: photos_truffe
        file: src/data/photos-truffe.json
        fields:
          - label: Photos
            name: photos
            widget: list
            fields:
              - label: Photo
                name: src
                widget: image
                hint: "Choisissez une photo nette. Nom conseillé : menu-truffe-eyzerac-plat.jpg (sans espace ni accent)."
              - label: "Legende de la photo (texte alternatif)"
                name: alt
                widget: string
                hint: "Décrivez le plat en une phrase simple et appétissante."

  - name: traiteur
    label: "Traiteur"
    description: "Mettre à jour les idées de menus proposées aux clients."
    files:
      - label: "Idees de menu"
        name: menu_traiteur
        file: src/data/menu-traiteur.json
        fields:
          - label: "Entrees"
            name: entrees
            widget: list
            hint: "Ajoutez, modifiez ou supprimez des entrées."
            fields:
              - { label: "Description du plat", name: plat, widget: string }
          - label: "Plats principaux"
            name: plats
            widget: list
            hint: "Ajoutez, modifiez ou supprimez des plats."
            fields:
              - { label: "Description du plat", name: plat, widget: string }
          - label: "Desserts"
            name: desserts
            widget: list
            hint: "Ajoutez, modifiez ou supprimez des desserts."
            fields:
              - { label: "Description du plat", name: plat, widget: string }
