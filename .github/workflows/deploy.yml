name: Publier le site

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Service à publier
        type: choice
        default: site
        options: [site, mail]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'mail'
    name: Construire et publier sur Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm test && npm run build

      - name: Publier sur Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  mail:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'mail'
    name: Préparer le service des e-mails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publier le service sans ouvrir les commandes
        run: npx wrangler deploy --config wrangler.mail-production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a8ef483748a8075bf90d197e2d5b6977
