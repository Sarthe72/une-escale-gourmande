<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Administration — Une Escale Gourmande</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'passemelvin/une-escale-gourmande',
          branch: 'master',
          base_url: window.location.origin,
          auth_endpoint: 'api/auth'
        },
        locale: 'fr',
        media_folder: 'public/images',
        public_folder: '/images',
        collections: [
          {
            name: 'chambre',
            label: "Chambre d'hote",
            files: [
              {
                label: 'Tarifs',
                name: 'tarifs',
                file: 'src/data/tarifs-chambre.json',
                fields: [
                  { label: 'Prix de base (2 pers. + petit-dejeuner) en euros', name: 'prix_base', widget: 'number', value_type: 'int' },
                  { label: 'Prix haute saison (juillet et aout) en euros', name: 'prix_haute_saison', widget: 'number', value_type: 'int' },
                  { label: 'Diner en option (par personne) en euros', name: 'prix_diner', widget: 'number', value_type: 'int' }
                ]
              },
              {
                label: 'Photos de la chambre',
                name: 'photos_chambre',
                file: 'src/data/photos-chambre.json',
                fields: [
                  {
                    label: 'Photos',
                    name: 'photos',
                    widget: 'list',
                    fields: [
                      { label: 'Photo', name: 'src', widget: 'image' },
                      { label: 'Description', name: 'alt', widget: 'string' }
                    ]
                  }
                ]
              },
              {
                label: 'Photos du domaine',
                name: 'photos_domaine',
                file: 'src/data/photos-domaine.json',
                fields: [
                  {
                    label: 'Photos',
                    name: 'photos',
                    widget: 'list',
                    fields: [
                      { label: 'Photo', name: 'src', widget: 'image' },
                      { label: 'Description', name: 'alt', widget: 'string' }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: 'truffe',
            label: 'Menu Truffe',
            files: [
              {
                label: 'Photos du menu truffe',
                name: 'photos_truffe',
                file: 'src/data/photos-truffe.json',
                fields: [
                  {
                    label: 'Photos',
                    name: 'photos',
                    widget: 'list',
                    fields: [
                      { label: 'Photo', name: 'src', widget: 'image' },
                      { label: 'Description', name: 'alt', widget: 'string' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
