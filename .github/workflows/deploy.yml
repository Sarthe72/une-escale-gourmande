name: Publier le site

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Service à publier
        type: choice
        default: site
        options: [site, mail, mail-check, retire-key]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  retire-key:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'retire-key'
    name: Retirer l’ancien accès par clé
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a8ef483748a8075bf90d197e2d5b6977
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler secret delete HOLIDAY_ADMIN_KEY --name une-escale-gourmande --config wrangler.jsonc
      - run: npx wrangler d1 execute escale-commandes-fetes --remote --command "DELETE FROM holiday_sessions" --config wrangler.jsonc
      - name: Vérifier le retrait du secret
        run: |
          npx wrangler secret list --name une-escale-gourmande --config wrangler.jsonc > /tmp/escale-secret-names.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/escale-secret-names.json','utf8'));if(s.some(x=>x.name==='HOLIDAY_ADMIN_KEY'))process.exit(1);console.log('Ancienne clé retirée.');"
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'site'
    name: Construire et publier sur Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm test && npm run build && node scripts/check-holiday-release.mjs

      - name: Préparer la structure des commandes
        run: npx wrangler d1 migrations apply escale-commandes-fetes --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a8ef483748a8075bf90d197e2d5b6977

      - name: Publier sur Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a8ef483748a8075bf90d197e2d5b6977

  mail:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'mail' || inputs.target == 'mail-check')
    name: Préparer le service des e-mails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publier le service sans ouvrir les commandes
        env:
          MAIL_CHECK: ${{ inputs.target == 'mail-check' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a8ef483748a8075bf90d197e2d5b6977
        run: |
          if [ "$MAIL_CHECK" = "true" ]; then
            npx wrangler deploy --config wrangler.mail-production.jsonc --var HOLIDAY_MAIL_TEST_ENABLED:true
          else
            npx wrangler deploy --config wrangler.mail-production.jsonc
          fi
